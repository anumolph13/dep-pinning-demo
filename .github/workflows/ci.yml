name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: re-audit the lock against new advisories

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.32"     # the lock tool itself is pinned too

jobs:
  # 1. The "right way": byte-identical, hash-verified install from the lock.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # tip: pin actions to a full commit SHA
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install from lock (hashes required)
        run: |
          python -m pip install --require-hashes --no-deps \
            -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Vulnerability audit of the full resolved tree
        run: pip-audit --strict --disable-pip -r requirements.txt -r requirements-dev.txt
      - name: Show the resolved transitive tree
        run: pipdeptree -p boto3,moto

  # 2. Fail if someone edited a .in file but didn't regenerate the lock.
  lock-is-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Recompile and compare
        run: |
          make lock      # keeps existing pins; only re-resolves if *.in changed
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::Lock files are stale. Run 'make lock' and commit."; exit 1; }

  # 3. The "wrong way", kept for comparison: install the unpinned file and
  #    record what it actually resolved to on this day.
  unpinned-demo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install unpinned (whatever PyPI serves right now)
        run: python -m pip install -r unpinned/requirements.txt pip-audit
      - name: Record what actually got installed
        run: |
          python -m pip freeze | tee resolved-$(date +%F).txt
          echo "Lines in unpinned/requirements.txt: $(grep -cv '^\s*$' unpinned/requirements.txt)"
          echo "Packages actually installed:        $(python -m pip freeze | wc -l)"
      - name: Tests against floating deps
        run: pytest -q
      - name: Drift report vs. mid-2024
        run: |
          python -m pip install "uv==${UV_VERSION}"
          python scripts/show_drift.py 2024-06-01
      - uses: actions/upload-artifact@v4
        with:
          name: unpinned-resolution
          path: resolved-*.txt
